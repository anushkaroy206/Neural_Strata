; =============================================================================
; Neural Strata — PlatformIO environments
; =============================================================================

[platformio]
src_dir = src
default_envs = main_hub

; -----------------------------------------------------------------------------
; Shared Base Configuration
; -----------------------------------------------------------------------------
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_flags =
    --before
    default_reset
    --after
    hard_reset
    --no-stub

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DNS_SCHEMA_VERSION=2
    -I src/common

lib_deps =
    adafruit/Adafruit MPU6050 @ ^2.2.6
    bogde/HX711 @ ^0.7.5

; -----------------------------------------------------------------------------
; 1. MAIN HUB (1 Board — USB-linked to Gateway)
; -----------------------------------------------------------------------------
[env:main_hub]
build_flags =
    ${env.build_flags}
    -DBOARD_MAIN_HUB=1
build_src_filter =
    +<main_hub/*>
    +<common/*>

; -----------------------------------------------------------------------------
; 2. LEVEL HUBS — one image per level. J1/J2 execute only on LEVEL=1;
;    J3/J4 only on LEVEL=2. A single image cannot drive both pairs.
; -----------------------------------------------------------------------------
[level_hub_common]
build_src_filter =
    +<level_hub/*>
    +<common/*>
lib_deps =
    ${env.lib_deps}
    fastled/FastLED @ 3.6.0
    miguelbalboa/MFRC522 @ ^1.4.11

[env:level_hub_l1]
build_flags =
    ${env.build_flags}
    -DBOARD_LEVEL_HUB=1
    -DLEVEL=1
build_src_filter = ${level_hub_common.build_src_filter}
lib_deps = ${level_hub_common.lib_deps}

[env:level_hub_l2]
build_flags =
    ${env.build_flags}
    -DBOARD_LEVEL_HUB=1
    -DLEVEL=2
build_src_filter = ${level_hub_common.build_src_filter}
lib_deps = ${level_hub_common.lib_deps}

; -----------------------------------------------------------------------------
; 3. SENSOR NODES — one image per board. NODE_ID selects the crack column
;    (N2 and N4) inside config.h, so the env name is the only switch.
; -----------------------------------------------------------------------------
[node_common]
build_src_filter =
    +<node/*>
    +<common/*>

[env:node_1]
build_flags =
    ${env.build_flags}
    -DBOARD_NODE=1
    -DNODE_ID=1
build_src_filter = ${node_common.build_src_filter}

[env:node_2]
build_flags =
    ${env.build_flags}
    -DBOARD_NODE=1
    -DNODE_ID=2
build_src_filter = ${node_common.build_src_filter}

[env:node_3]
build_flags =
    ${env.build_flags}
    -DBOARD_NODE=1
    -DNODE_ID=3
build_src_filter = ${node_common.build_src_filter}

[env:node_4]
build_flags =
    ${env.build_flags}
    -DBOARD_NODE=1
    -DNODE_ID=4
build_src_filter = ${node_common.build_src_filter}
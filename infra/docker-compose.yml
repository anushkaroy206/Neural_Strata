# ============================================================================
# Neural Strata — local infrastructure. Phase 9 (B6).
# ============================================================================
# Two Postgres instances and the stand-in cloud, so the whole two-tier story runs
# on one laptop with no account and no internet:
#
#   edge    the mine's database. Same server the project already runs; this file
#           just makes a *fresh* machine reproducible (see docs/Dual_Database.md §C.1).
#   cloud   a second Postgres standing in for Neon/Supabase, loaded with
#           infra/sql/cloud_schema.sql + ingest_function.sql. The sync daemon talks
#           to it over exactly the same psycopg2 path it will use in production —
#           only NS_CLOUD_DB_URL differs.
#   mock    the HTTP stand-in (`python3 -m sim.cloud_mock`), for the outbox path.
#
# Usage:
#   docker compose -f infra/docker-compose.yml up -d
#   export NS_CLOUD_DB_URL="postgresql://ns:ns@localhost:5433/neural_strata_cloud"
#   export NS_CLOUD_HTTP_URL="http://localhost:5070"
#   python3 backend/app.py            # the daemon picks both up at boot
#
# Nothing here is required for the prototype to run: with NS_CLOUD_DB_URL and
# NS_CLOUD_HTTP_URL unset, the edge is fully functional and *no* cloud code
# executes. "Optional" is the design, not a limitation — a mine's console must not
# depend on a container being up.
# ============================================================================

services:
  edge:
    image: postgres:17-alpine
    container_name: ns-edge
    environment:
      POSTGRES_USER: ns
      POSTGRES_PASSWORD: ns
      POSTGRES_DB: neural_strata
      # The edge writes at 2 Hz and is the source of truth; durability first.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "5432:5432"
    volumes:
      - edge-data:/var/lib/postgresql/data
      # Applied only when the volume is first created, in filename order.
      - ../backend/persistence/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ns -d neural_strata"]
      interval: 10s
      timeout: 5s
      retries: 5

  cloud:
    image: postgres:17-alpine
    container_name: ns-cloud
    environment:
      POSTGRES_USER: ns
      POSTGRES_PASSWORD: ns
      POSTGRES_DB: neural_strata_cloud
    ports:
      - "5433:5432"          # 5433, so it cannot be mistaken for the edge
    volumes:
      - cloud-data:/var/lib/postgresql/data
      # Loaded once, in filename order, only when the volume is empty. The two
      # files are idempotent, so a re-created volume converges on the same schema.
      - ./sql/cloud_schema.sql:/docker-entrypoint-initdb.d/01-cloud_schema.sql:ro
      - ./sql/ingest_function.sql:/docker-entrypoint-initdb.d/02-ingest_function.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ns -d neural_strata_cloud"]
      interval: 10s
      timeout: 5s
      retries: 5

  mock:
    image: python:3.12-slim
    container_name: ns-cloud-mock
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir flask==3.1.3 &&
             python3 -m sim.cloud_mock --host 0.0.0.0 --port 5070
             --db /app/runtime/cloud-mock.sqlite3"
    environment:
      NS_CLOUD_HMAC_KEY: ${NS_CLOUD_HMAC_KEY:-}
      NS_CLOUD_MOCK_STALL_S: "6"
    ports:
      - "5070:5070"
    volumes:
      - ../backend:/app
    depends_on:
      cloud:
        condition: service_healthy

volumes:
  edge-data:
  cloud-data:
